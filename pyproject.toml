[project]
name = "rankforge"
version = "0.1.0"
description = "Temporal two-stage implicit recommendation and LambdaMART ranking"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "scikit-learn>=1.6,<1.8",
 "lightgbm>=4.6,<4.8", "pydantic>=2.10,<3", "pyyaml>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
[project.optional-dependencies]
tuning = ["optuna>=4.2,<5"]
parquet = ["pyarrow>=19,<22"]
[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<0.29", "ruff>=0.11,<1"]
[project.scripts]
rankforge = "rankforge.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/rankforge"]
[tool.ruff.lint]
select = ["F"]
[tool.pytest.ini_options]
testpaths = ["tests"]
